<!doctype html>
<html lang="fr">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<script data-svelte-exporter-theme>
			(function () {
				var mode = "light";
				try {
					var saved = localStorage.getItem("svelte-exporter-color-mode");
					if (saved === "dark" || saved === "light") mode = saved;
				} catch (e) {}
				document.body.classList.add.apply(document.body.classList, [].concat("theme-" + mode));
			})();
		</script>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>

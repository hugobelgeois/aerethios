name: Deploy to GitHub Pages

# Uses Pages' own Actions-based deployment — make sure the repo's Settings →
# Pages → "Build and deployment" → Source is set to "GitHub Actions" (not
# "Deploy from a branch"), or this workflow runs but Pages won't serve it.
on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Asks GitHub where Pages actually serves this site: "/<repo>" for a
      # project page on <user>.github.io, "" for a custom domain or a
      # <user>.github.io repo — so the build follows the site's real URL.
      - id: pages
        uses: actions/configure-pages@v6
      - run: npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: "build"

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
